<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 28" role="img" aria-label="The Trade Tool">
    <defs>
        <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#06b6d4"/>
            <stop offset="50%" stop-color="#0ea5e9"/>
            <stop offset="100%" stop-color="#2563eb"/>
        </linearGradient>
        <linearGradient id="trade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#0891b2"/>
            <stop offset="50%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#2563eb"/>
        </linearGradient>
    </defs>
    <rect x="0" y="5" width="3" height="18" rx="1.5" fill="url(#bar)"/>
    <text x="14" y="19" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#475569">The</text>
    <text x="40" y="19" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="-0.45" fill="url(#trade)">Trade</text>
    <text x="88" y="19" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#475569">Tool</text>
</svg>
